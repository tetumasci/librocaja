<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscuro · Transferir entre cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.frame{width:390px;margin:0 auto}
</style>
</head>
<body>
<div class="frame">
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#0A0A0A;color:#ECEEED;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;padding:20px 20px 0">
<div style="display:flex;align-items:center;height:44px"><div style="height:44px;border-radius:22px;background:#161817;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:700">Octubre 2026</div></div><div style="margin-top:14px;height:240px;border-radius:28px;background:#123B33"></div><div style="margin-top:12px;height:70px;border-radius:22px;background:#161817"></div><div style="margin-top:12px;height:200px;border-radius:28px;background:#161817"></div><div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.65)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:740px;box-sizing:border-box;background:#161817;border-radius:28px 28px 0 0;padding:10px 20px 0;overflow:hidden"><div style="width:40px;height:5px;border-radius:3px;background:#2E3231;margin:0 auto"></div><h2 style="margin:12px 0 0;font-size:18px;font-weight:700">Transferir entre cuentas</h2>
<div style="margin-top:6px;text-align:center"><label for="tmonto" style="font-size:12px;font-weight:700;color:#A2AAA6;letter-spacing:.04em;text-transform:uppercase">Monto</label><div style="display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:2px"><span style="font-size:26px;font-weight:700;color:#A2AAA6">$</span><input id="tmonto" value="50.000" style="width:190px;border:0;background:transparent;font-size:48px;font-weight:800;letter-spacing:-.03em;outline:0;font-variant-numeric:tabular-nums"></div></div>
<div style="display:block;margin-top:10px;font-size:12px;font-weight:700;color:#A2AAA6;letter-spacing:.04em;text-transform:uppercase">Desde</div>
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#1D201F;color:#ECEEED;border:1px solid #2E3231;"><span style="font-size:16px">💵</span>Efectivo</button><button aria-pressed="true" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#123B33;color:#F2F7F4;border:1px solid #2F6A5C;"><span style="font-size:16px">🏦</span>Banco</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#1D201F;color:#ECEEED;border:1px solid #2E3231;"><span style="font-size:16px">📱</span>Mercado Pago</button></div>
<div style="display:block;margin-top:12px;font-size:12px;font-weight:700;color:#A2AAA6;letter-spacing:.04em;text-transform:uppercase">Hacia</div>
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#1D201F;color:#ECEEED;border:1px solid #2E3231;"><span style="font-size:16px">💵</span>Efectivo</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#1D201F;color:#ECEEED;border:1px solid #2E3231;"><span style="font-size:16px">🏦</span>Banco</button><button aria-pressed="true" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#123B33;color:#F2F7F4;border:1px solid #2F6A5C;"><span style="font-size:16px">📱</span>Mercado Pago</button></div>
<div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;height:48px;border-radius:16px;border:1px solid #2E3231;background:#1D201F;padding:0 16px"><span style="font-size:14px;color:#A2AAA6">Fecha</span><span style="font-size:15px;font-weight:700">Hoy · vie 2 oct</span></div>
<label for="tnota" style="display:block;margin-top:12px;font-size:12px;font-weight:700;color:#A2AAA6;letter-spacing:.04em;text-transform:uppercase">Nota (opcional)</label>
<input id="tnota" value="pasé plata a MP" style="margin-top:6px;width:100%;box-sizing:border-box;height:48px;border-radius:16px;border:1px solid #2E3231;background:#1D201F;padding:0 16px;font-size:15px">
<button style="margin-top:14px;width:100%;height:56px;border-radius:28px;background:#8FDCC0;color:#07231B;font-size:16px;font-weight:700">Registrar transferencia</button>
<button style="width:100%;height:44px;font-size:14px;font-weight:600;color:#A2AAA6">Cancelar</button>
</div>
</div>
</div>
</body>
</html>
