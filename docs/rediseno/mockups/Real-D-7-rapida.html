<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscuro · Carga rápida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.frame{width:390px;margin:0 auto}
</style>
</head>
<body>
<div class="frame">
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#0B0F18;color:#F1EEE6;font-family:'Outfit',sans-serif;overflow:hidden;padding:20px 20px 0">
<div style="display:flex;align-items:center;height:44px"><div style="height:44px;border-radius:22px;background:#141A27;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:700">Octubre 2026</div></div><div style="margin-top:14px;height:240px;border-radius:28px;background:#1B2B4B"></div><div style="margin-top:12px;height:70px;border-radius:22px;background:#141A27"></div><div style="margin-top:12px;height:200px;border-radius:28px;background:#141A27"></div><div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.65)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:620px;box-sizing:border-box;background:#141A27;border-radius:28px 28px 0 0;padding:10px 20px 0;overflow:hidden"><div style="width:40px;height:5px;border-radius:3px;background:#27304A;margin:0 auto"></div><h2 style="margin:12px 0 0;font-size:18px;font-weight:700">Carga rápida</h2>
<label for="rapido" style="display:block;margin-top:14px;font-size:12px;font-weight:700;color:#A5ADBD;letter-spacing:.04em;text-transform:uppercase">Escribí el movimiento</label>
<input id="rapido" value="500 nafta" style="margin-top:6px;width:100%;box-sizing:border-box;height:52px;border-radius:16px;border:1.5px solid #F2B94B;background:#192031;padding:0 16px;font-size:17px;font-weight:600"><p style="margin:6px 0 0;font-size:12px;color:#A5ADBD">Ejemplos: 500 nafta · cobré 50000 sueldo</p>
<div style="margin-top:18px;display:flex;align-items:center;gap:12px"><div style="flex:1"><div style="font-size:12px;font-weight:700;color:#A5ADBD;letter-spacing:.04em;text-transform:uppercase">Monto detectado</div><div style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:#FF9A73">−$ 500</div></div><span style="font-size:12px;font-weight:700;padding:6px 12px;border-radius:14px;background:#3A221B;color:#FF9A73">Gasto</span></div>
<div style="display:block;margin-top:12px;font-size:12px;font-weight:700;color:#A5ADBD;letter-spacing:.04em;text-transform:uppercase">Categoría sugerida</div>
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F2B94B;border:1.5px dashed #F2B94B;"><span style="font-size:16px">🚌</span>Transporte</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;"><span style="font-size:16px">🍔</span>Comida</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;"><span style="font-size:16px">🎬</span>Otros</button></div>
<p style="margin:6px 0 0;font-size:12px;color:#F2B94B;font-style:italic">Sugerida por tus movimientos anteriores</p>
<div style="display:block;margin-top:12px;font-size:12px;font-weight:700;color:#A5ADBD;letter-spacing:.04em;text-transform:uppercase">Cuenta</div>
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;"><span style="font-size:16px">💵</span>Efectivo</button><button aria-pressed="true" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#1B2B4B;color:#F7F4EC;border:1px solid #35507F;"><span style="font-size:16px">🏦</span>Banco</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;"><span style="font-size:16px">📱</span>Mercado Pago</button></div>
<button style="margin-top:18px;width:100%;height:56px;border-radius:28px;background:#F2B94B;color:#2B1D00;font-size:16px;font-weight:700">Guardar</button>
<button style="width:100%;height:44px;font-size:14px;font-weight:600;color:#A5ADBD">Cancelar</button>
</div>
</div>
</div>
</body>
</html>
