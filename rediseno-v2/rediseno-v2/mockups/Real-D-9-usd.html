<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscuro · Depositar ahorro en USD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.frame{width:390px;margin:0 auto}
</style>
</head>
<body>
<div class="frame">
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#0B0F18;color:#F1EEE6;font-family:'Outfit',sans-serif;overflow:hidden;padding:20px 20px 0">
<div style="display:flex;align-items:center;height:44px"><div style="height:44px;border-radius:22px;background:#141A27;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:700">Octubre 2026</div></div><div style="margin-top:14px;height:240px;border-radius:28px;background:#1B2B4B"></div><div style="margin-top:12px;height:70px;border-radius:22px;background:#141A27"></div><div style="margin-top:12px;height:200px;border-radius:28px;background:#141A27"></div><div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.65)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:816px;box-sizing:border-box;background:#141A27;border-radius:28px 28px 0 0;padding:10px 20px 0;overflow:hidden"><div style="width:40px;height:5px;border-radius:3px;background:#27304A;margin:0 auto"></div><h2 style="margin:12px 0 0;font-size:18px;font-weight:700">Depositar ahorro en USD</h2>
<div style="margin-top:6px;text-align:center"><label for="usd" style="font-size:12px;font-weight:700;color:#A5ADBD;letter-spacing:.04em;text-transform:uppercase">Monto</label><div style="display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:2px"><span style="font-size:26px;font-weight:700;color:#A5ADBD">USD</span><input id="usd" value="100" style="width:190px;border:0;background:transparent;font-size:48px;font-weight:800;letter-spacing:-.03em;outline:0;font-variant-numeric:tabular-nums"></div></div>
<label for="tc" style="display:block;margin-top:8px;font-size:12px;font-weight:700;color:#A5ADBD;letter-spacing:.04em;text-transform:uppercase">Tipo de cambio · 1 USD = $</label>
<input id="tc" value="1.250" style="margin-top:6px;width:100%;box-sizing:border-box;height:48px;border-radius:16px;border:1px solid #27304A;background:#192031;padding:0 16px;font-size:15px">
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"><button aria-pressed="true" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#1B2B4B;color:#F7F4EC;border:1px solid #35507F;">Blue</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;">Oficial</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;">MEP</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;">Tarjeta</button></div>
<p style="margin:6px 0 0;font-size:12px;color:#A5ADBD">Cotización blue de hoy · actualizada hace 10 min</p><p style="margin:6px 0 0;font-size:14px;font-weight:700;color:#F2B94B">≈ $ 125.000</p>
<div style="display:block;margin-top:10px;font-size:12px;font-weight:700;color:#A5ADBD;letter-spacing:.04em;text-transform:uppercase">Cuenta de origen</div>
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;"><span style="font-size:16px">💵</span>Efectivo</button><button aria-pressed="true" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#1B2B4B;color:#F7F4EC;border:1px solid #35507F;"><span style="font-size:16px">🏦</span>Banco</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;"><span style="font-size:16px">📱</span>Mercado Pago</button></div>
<div style="display:block;margin-top:12px;font-size:12px;font-weight:700;color:#A5ADBD;letter-spacing:.04em;text-transform:uppercase">Vincular a meta (opcional)</div>
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#192031;color:#F1EEE6;border:1px solid #27304A;">Ninguna</button><button aria-pressed="true" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#1B2B4B;color:#F7F4EC;border:1px solid #35507F;"><span style="font-size:16px">🎯</span>Viaje</button></div>
<button style="margin-top:14px;width:100%;height:56px;border-radius:28px;background:#F2B94B;color:#2B1D00;font-size:16px;font-weight:700">Guardar depósito</button>
<button style="width:100%;height:44px;font-size:14px;font-weight:600;color:#A5ADBD">Cancelar</button>
</div>
</div>
</div>
</body>
</html>
