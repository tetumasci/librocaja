<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claro · Acciones del movimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#6b7280}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.frame{width:390px;margin:0 auto}
</style>
</head>
<body>
<div class="frame">
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F6F1E9;color:#1B2236;font-family:'Outfit',sans-serif;overflow:hidden;padding:20px 20px 0">
<div style="display:flex;align-items:center;height:44px"><div style="height:44px;border-radius:22px;background:#FFFFFF;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:700">Octubre 2026</div></div><div style="margin-top:14px;height:240px;border-radius:28px;background:#1B2B4B"></div><div style="margin-top:12px;height:70px;border-radius:22px;background:#FFFFFF"></div><div style="margin-top:12px;height:200px;border-radius:28px;background:#FFFFFF"></div><div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(27,34,54,.55)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:260px;box-sizing:border-box;background:#FFFFFF;border-radius:28px 28px 0 0;padding:10px 20px 0;overflow:hidden"><div style="width:40px;height:5px;border-radius:3px;background:#DED5C6;margin:0 auto"></div><h2 style="margin:12px 0 0;font-size:18px;font-weight:700">Café y medialunas</h2>
<div style="margin-top:8px"><button style="display:flex;align-items:center;gap:12px;width:100%;height:56px;border-bottom:1px solid #EEE7DA;font-size:15px;font-weight:600;color:#1B2236;text-align:left"><span style="font-size:18px;width:24px;text-align:center">✏️</span>Editar movimiento</button>
<button style="display:flex;align-items:center;gap:12px;width:100%;height:56px;border-bottom:1px solid #EEE7DA;font-size:15px;font-weight:600;color:#B3361B;text-align:left"><span style="font-size:18px;width:24px;text-align:center">🗑️</span>Eliminar</button>
</div><button style="width:100%;height:44px;font-size:14px;font-weight:600;color:#5B6477">Cancelar</button>
</div>
</div>
</div>
</body>
</html>
