<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claro · Editar cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#6b7280}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.frame{width:390px;margin:0 auto}
</style>
</head>
<body>
<div class="frame">
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#EEF2EC;color:#14231F;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;padding:20px 20px 0">
<div style="display:flex;align-items:center;height:44px"><div style="height:44px;border-radius:22px;background:#FFFFFF;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:700">Octubre 2026</div></div><div style="margin-top:14px;height:240px;border-radius:28px;background:#123B33"></div><div style="margin-top:12px;height:70px;border-radius:22px;background:#FFFFFF"></div><div style="margin-top:12px;height:200px;border-radius:28px;background:#FFFFFF"></div><div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(18,35,31,.55)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:826px;box-sizing:border-box;background:#FFFFFF;border-radius:28px 28px 0 0;padding:10px 20px 0;overflow:hidden"><div style="width:40px;height:5px;border-radius:3px;background:#CBD6C8;margin:0 auto"></div><h2 style="margin:12px 0 0;font-size:18px;font-weight:700">Editar cuenta</h2>
<label for="cnom" style="display:block;margin-top:8px;font-size:12px;font-weight:700;color:#55645E;letter-spacing:.04em;text-transform:uppercase">Nombre</label>
<input id="cnom" value="Banco" style="margin-top:6px;width:100%;box-sizing:border-box;height:48px;border-radius:16px;border:1px solid #CBD6C8;background:#F7FAF6;padding:0 16px;font-size:15px">
<div style="display:block;margin-top:12px;font-size:12px;font-weight:700;color:#55645E;letter-spacing:.04em;text-transform:uppercase">Ícono</div>
<div style="margin-top:8px;display:flex;gap:8px"><button aria-label="Ícono 💵" style="width:44px;height:44px;border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;background:#F7FAF6;border:1px solid #CBD6C8">💵</button><button aria-label="Ícono 🏦" style="width:44px;height:44px;border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;background:#123B33;border:1px solid #123B33">🏦</button><button aria-label="Ícono 📱" style="width:44px;height:44px;border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;background:#F7FAF6;border:1px solid #CBD6C8">📱</button><button aria-label="Ícono 💳" style="width:44px;height:44px;border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;background:#F7FAF6;border:1px solid #CBD6C8">💳</button><button aria-label="Ícono 🪙" style="width:44px;height:44px;border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;background:#F7FAF6;border:1px solid #CBD6C8">🪙</button><button aria-label="Ícono 👛" style="width:44px;height:44px;border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;background:#F7FAF6;border:1px solid #CBD6C8">👛</button></div>
<div style="display:block;margin-top:12px;font-size:12px;font-weight:700;color:#55645E;letter-spacing:.04em;text-transform:uppercase">Tipo</div>
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#F7FAF6;color:#14231F;border:1px solid #CBD6C8;">Efectivo</button><button aria-pressed="true" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#123B33;color:#F4F7F1;border:1px solid #123B33;">Banco</button><button aria-pressed="false" style="height:44px;padding:0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#F7FAF6;color:#14231F;border:1px solid #CBD6C8;">Billetera virtual</button></div>
<label for="csi" style="display:block;margin-top:12px;font-size:12px;font-weight:700;color:#55645E;letter-spacing:.04em;text-transform:uppercase">Saldo inicial (lo que tenías antes de usar la app)</label>
<input id="csi" value="0" style="margin-top:6px;width:100%;box-sizing:border-box;height:48px;border-radius:16px;border:1px solid #CBD6C8;background:#F7FAF6;padding:0 16px;font-size:15px">
<div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px dashed #CBD6C8;border-bottom:1px dashed #CBD6C8"><span style="font-size:12px;font-weight:700;color:#55645E;text-transform:uppercase;letter-spacing:.04em">Saldo calculado actual</span><span style="font-size:15px;font-weight:800;font-variant-numeric:tabular-nums">$ 1.214.800</span></div>
<label for="creal" style="display:block;margin-top:10px;font-size:12px;font-weight:700;color:#55645E;letter-spacing:.04em;text-transform:uppercase">Corregir saldo real (opcional)</label>
<input id="creal" value="" style="margin-top:6px;width:100%;box-sizing:border-box;height:48px;border-radius:16px;border:1px solid #CBD6C8;background:#F7FAF6;padding:0 16px;font-size:15px">
<button style="margin-top:14px;width:100%;height:56px;border-radius:28px;background:#123B33;color:#F4F7F1;font-size:16px;font-weight:700">Guardar cambios</button>
<button style="width:100%;height:44px;font-size:14px;font-weight:600;color:#55645E">Cancelar</button>
</div>
</div>
</div>
</body>
</html>
